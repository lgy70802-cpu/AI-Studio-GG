.rcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 2px #1c2a4a0a;min-width:0}
.rcard:hover,.rcard:focus-within{box-shadow:0 8px 22px #23345818}
.thumb{position:relative;width:100%;background:#e9edf3;cursor:pointer;overflow:hidden}
.tin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden}
.ov-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 10px 18px;background:linear-gradient(#0a142bb3,transparent);color:#fff;font-size:12px;line-height:1.3;text-shadow:0 1px 2px #0006;pointer-events:none}
.ov-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-type{flex-shrink:0;font-size:11px;opacity:.92;white-space:nowrap}
.rcard.v .ov-top{flex-direction:column;gap:2px}
.ov-fit{position:absolute;left:8px;bottom:8px;box-shadow:0 1px 4px #0003;transition:opacity .15s}
.ov-act{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:20px 8px 8px;background:linear-gradient(transparent,#0a142bd9);opacity:0;transition:opacity .15s}
.rcard:hover .ov-act,.rcard:focus-within .ov-act{opacity:1}
.rcard:hover .ov-fit,.rcard:focus-within .ov-fit{opacity:0}
.ov-act button{padding:4px 9px;font-size:11px;border:0;border-radius:7px;background:#fff;color:var(--ink)}
.ov-act button.go{background:var(--blue);color:#fff}
.ov-act button.danger{color:#c4362a}
button.danger.solid{background:#d2463a;border-color:#d2463a;color:#fff}
button.danger.solid:hover{background:#bb3a2f;border-color:#bb3a2f}
.rcard.v .ov-act{padding-top:60px}

function downloads(){modal(`<div class="modal-header"><h2>下载记录</h2><button onclick="closeModal()">关闭</button></div>${downloaded.length?downloaded.map(id=>`<div class="checkrow"><span>${getR(id).name}</span><span class="tag ok">已加入资源库</span></div>`).join(''):'<div class="empty">暂无下载记录。在发现资源中下载示例内容。</div>'}`)}
function resourceDetail(id){let r=getR(id);modal(`<div class="modal-header"><div><h2>${esc(r.name)}</h2><p class="small muted">${r.type} · ${r.sizes.map(sizeText).join(' / ')||'尺寸待检查'}</p></div><button onclick="closeModal()">关闭</button></div>${preview(r,null,240)}<h3 class="gap">在我的设备上</h3>${devices.map(d=>`<div class="checkrow"><div>${esc(d.name)}<div class="small muted">${d.model} · ${sizeText(dims(d))}</div></div>${badge(r,d)}</div>`).join('')||'<p class="muted gap">连接设备后查看适配结果。</p>'}<div class="row gap"><button onclick="favorite(${id});toast('收藏状态已更新')">${favs.includes(id)?'取消收藏':'收藏'}</button><button onclick="addToPlaylist(${id})">加入轮播列表</button>${r.local&&page!=='discover'?`<button onclick="closeModal();deleteResource(${id})">删除</button>`:''}${r.local&&(r.type==='壁纸'||r.type==='视频')?`<button onclick="closeModal();useAsBackground(${id})">用作主题背景</button>`:''}${r.type==='主题'||r.type==='时钟'?`<button onclick="closeModal();openEditor(${id})">编辑布局</button>`:''}<span class="grow"></span><button class="primary" onclick="${r.local?`startApply(${id},null)`:`download(${id});closeModal()`}">${r.local?'选择设备并使用':'下载到资源库'}</button></div>`)}
let editorBackup=null; let applying=0;
function applyModal(id){applying=id;pendingConfirm=0;let r=getR(id);modal(`<div class="modal-header"><div><h2>应用「${esc(r.name)}」</h2><p class="muted small">每台设备分别选择适配方式，未选设备保持原内容。</p></div><button onclick="closeModal()">关闭</button></div>${!r.sizes.length?'<div class="notice warning">尺寸未知，请先检查素材；本原型暂不允许应用。</div>':''}${devices.length?devices.map(d=>{let f=fit(r,d);return `<div class="targetrow"><input aria-label="选择${esc(d.name)}" type="checkbox" name="applyDevice" value="${d.id}" ${d.id===(applyPreset||target)&&d.online&&r.sizes.length?'checked':''} ${!d.online||!r.sizes.length?'disabled':''}><div><strong>${esc(d.name)}</strong> <span class="tag">${d.model}</span><div class="small muted">${sizeText(dims(d))} · ${d.online?'已连接':'未连接，暂不可应用'}</div><div class="row" style="margin:6px 0">${badge(r,d)}</div><select aria-label="${esc(d.name)}适配方式" id="mode-${d.id}" onchange="updateFitPreview('${d.id}')"><option value="contain">${f.loss===0?'使用匹配布局':'完整显示 · 保留全部内容'}</option>${r.type==='壁纸'||r.type==='视频'?'<option value="cover">裁切铺满 · 居中裁剪</option>':''}</select>${f.loss>.05&&(r.type==='主题'||r.type==='时钟')?'<div class="small muted">建议在编辑器创建专属布局；完整显示会留边。</div>':''}</div><div id="fit-${d.id}">${fitPreview(r,d,'contain')}</div></div>`}).join(''):'<div class="empty">请先连接设备。<br><button onclick="closeModal();addDevice()">连接新设备</button></div>'}<div class="notice gap">横竖屏采用对应逻辑画布。此处为适配示意；点击应用只更新原型中的设备状态。</div><div class="row gap"><button onclick="closeModal()">取消</button><span class="grow"></span><button class="primary" id="applyBtn" ${!devices.some(d=>d.online)||!r.sizes.length?'disabled':''} onclick="confirmApply()">应用到所选设备</button></div>`)}
function fitPreview(r,d,mode){let ds=dims(d),index=fit(r,d).index||0,s=r.sizes[index]||ds,ratio=ds[0]/ds[1],W=Math.min(155,90*ratio),H=W/ratio,scale=mode==='cover'?Math.max(W/s[0],H/s[1]):Math.min(W/s[0],H/s[1]);return `<div class="preview" style="height:110px"><div style="width:${W}px;height:${H}px;background:#131c2d;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0"><div style="width:${s[0]*scale}px;height:${s[1]*scale}px;flex-shrink:0">${art(r,null,index)}</div></div></div>`}
function updateFitPreview(id){$('#fit-'+id).innerHTML=fitPreview(getR(applying),getD(id),$('#mode-'+id).value)}
function confirmApply(){let ids=[...document.querySelectorAll('[name=applyDevice]:checked')].map(e=>e.value);if(!ids.length)return toast('请至少选择一台已连接设备');{let heavy=ids.filter(id=>fit(getR(applying),getD(id)).loss>.05);if(heavy.length&&pendingConfirm!==applying){pendingConfirm=applying;$('#applyBtn').textContent='仍然使用';return toast('「'+heavy.map(id=>getD(id).name).join('、')+'」明显留边，再点一次“仍然使用”确认')}}pendingConfirm=0;applyPreset=null;ids.forEach(id=>{let d=getD(id);d.content=applying;d.running=true;d.fit=$('#mode-'+id).value;playlists.filter(p=>p.device===id).forEach(p=>p.playing=false)});closeModal();render();if(devices.length===1)return toast('已应用到「'+getD(ids[0]).name+'」');modal(`<div class="modal-header"><h2>应用结果</h2><button onclick="closeModal()">关闭</button></div>${ids.map(id=>`<div class="checkrow"><span>${esc(getD(id).name)}</span><span class="tag ok">已更新演示画面</span></div>`).join('')}<div class="row gap"><span class="grow"></span><button class="primary" onclick="closeModal();go('overview')">查看所有设备</button></div>`)}
function toggleOutput(id){let d=getD(id);if(!d.running&&!d.content)return toast('这台设备还没有内容，请先选择内容');d.running=!d.running;if(!d.running)playlists.filter(p=>p.device===id).forEach(p=>p.playing=false);render();toast(`${d.name}：${d.running?'已恢复演示输出':'已停止输出，其他设备不受影响'}`)}
function devicePage(){let d=getD(detailDevice)||devices[0];return heading('设备管理','每台设备独立命名、设置方向，互不影响。',`<button onclick="toast('演示设备列表已刷新')">↻ 刷新</button><button class="primary" onclick="addDevice()">＋ 连接新设备</button>`)+(!d?'<div class="empty"><h2>尚未连接设备</h2><p>设备会按稳定身份保存，不按插入顺序识别。</p><button onclick="addDevice()">添加第一台设备</button></div>':`<div class="split ${devices.length===1?'single':''}"><div>${devices.map(x=>`<div class="list-item ${x.id===d.id?'active':''}" tabindex="0" role="button" onkeydown="if(event.key==='Enter'){detailDevice='${x.id}';render()}" onclick="detailDevice='${x.id}';render()"><strong>${esc(x.name)}</strong><div class="small muted">${x.model} · ${sizeText(dims(x))}</div><span class="tag ${x.online?'ok':''}" style="margin-top:8px">${x.online?'已连接':'未连接'}</span></div>`).join('')}</div><div class="stack"><div class="panel"><div class="row between"><h2>${esc(d.name)}</h2><span class="tag">序列号 ${esc(d.serial||'未知')}</span></div><div class="gap ${d.flash?'flash':''}">${devicePreview(d,210)}</div><div class="formgrid gap"><label><span class="label">设备名称</span><input id="devname" value="${esc(d.name)}" maxlength="30"></label><label><span class="label">显示方向</span><select id="rotation">${[[0,'横屏 · 0°'],[90,'竖屏 · 90°'],[180,'横屏翻转 · 180°'],[270,'竖屏翻转 · 270°']].map(([v,n])=>`<option value="${v}" ${d.rot===v?'selected':''}>${n}</option>`).join('')}</select></label><label><span class="label">原始输出尺寸</span><input value="${d.w} × ${d.h}" disabled></label><label><span class="label">当前连接</span><input value="USB · ${d.model}" disabled></label></div>${devices.filter(x=>x.model===d.model).length>1?`<div class="notice gap">同型号设备按序列号区分，不按插入顺序。规格由型号决定：${d.model} 为 ${d.w} × ${d.h}。</div>`:''}<div class="row gap">${devices.length>1?`<button ${!d.online?'disabled':''} onclick="identify('${d.id}')">识别这台设备</button>`:''}<button onclick="getD('${d.id}').online=!getD('${d.id}').online;render();toast('已切换演示连接状态')">模拟${d.online?'断开':'重连'}</button><span class="grow"></span><button class="primary" onclick="saveDevice('${d.id}')">保存设备设置</button></div></div><div class="panel"><h3>独立播放</h3><p class="muted small gap">当前内容：${getR(d.content).name}。更改本设备不会影响其他设备。</p><div class="row gap"><button onclick="target='${d.id}';go('library')">更换内容</button><button onclick="go('playlists')">设置轮播列表</button><button ${!d.online?'disabled':''} onclick="toggleOutput('${d.id}')">${d.running?'停止输出':'恢复显示'}</button></div></div><details class="panel"><summary>高级设置 · 输出性能与物理屏关联</summary><div class="formgrid gap"><label><span class="label">视频模式</span><select id="quality"><option>画质优先</option><option>流畅优先</option></select></label><label><span class="label">物理屏关联组</span><input placeholder="同一屏的 USB / 系统连接使用同一名称"></label></div><p class="small muted gap">目标帧率不等于实测帧率。实际性能、连接能力应由设备能力表提供；此处仅规划设置位置。</p><button class="gap" onclick="toast('高级设置已在本次演示中确认')">确认演示设置</button></details></div></div>`)}
function saveDevice(id){let d=getD(id),name=$('#devname').value.trim();if(!name)return toast('请输入设备名称');let rot=Number($('#rotation').value),changed=rot!==d.rot;d.name=name;d.rot=rot;if(changed){d.running=false;playlists.filter(p=>p.device===id).forEach(p=>p.playing=false)}render();toast(changed?'方向已更新；请重新预览并应用内容':'设备名称已保存')}
function addDevice(){modal(`<div class="modal-header"><h2>添加演示设备</h2><button onclick="closeModal()">关闭</button></div><label class="label">设备型号</label><select id="newmodel" style="width:100%"><option>D69</option><option>D92</option></select><label class="label gap">名称</label><input id="newname" placeholder="例如：桌面右侧屏" style="width:100%" maxlength="30"><p class="muted small gap">真实软件通过设备枚举发现硬件。本按钮仅添加原型数据。</p><button class="primary gap" onclick="confirmDevice()">添加</button>`,true)}
function confirmDevice(){let m=$('#newmodel').value,id='dev'+Date.now(),name=$('#newname').value.trim()||m+' 新设备';devices.push({id,name,model:m,w:m==='D69'?1280:1920,h:m==='D92'?462:480,rot:0,online:true,running:false,content:1,serial:m+'-'+Math.random().toString(16).slice(2,6).toUpperCase()});target=id;detailDevice=id;closeModal();go('devices')}
function creator(){return heading('创作中心','为不同设备与方向设计布局，一个主题可以包含多个布局。',`<button class="primary" onclick="newProject()">＋ 新建主题</button>`)+`<div class="hero"><div><span class="small">CREATE YOUR SCREEN</span><h2>从灵感到设备</h2><p>可以为同一个主题补充不同设备与方向的布局。</p><button class="gap" onclick="newProject()">从空白画布开始 →</button></div><div class="bigtime">Aa</div></div><div class="row between"><h2>我的主题与示例模板</h2><span class="muted small">布局独立保存，素材统一引用</span></div><div class="grid gap">${resources.filter(r=>r.type==='主题'||r.created).map(r=>`<div class="card">${preview(r,null,155)}<div class="card-body"><h3>${esc(r.name)}</h3><p class="muted small">${r.sizes.length} 个布局 · ${r.sizes.map(sizeText).join(' / ')}</p><div class="row gap"><button class="primary small" onclick="openEditor(${r.id})">编辑主题</button><button class="small" onclick="applyModal(${r.id})">使用主题</button></div></div></div>`).join('')}</div>`}
function newProject(){modal(`<div class="modal-header"><h2>新建主题</h2><button onclick="closeModal()">关闭</button></div><label class="label">主题名称</label><input id="projectname" value="我的新主题" style="width:100%" maxlength="40"><label class="label gap">初始布局</label><select id="projectsize" style="width:100%"><option value="1920,462">D92 横屏 · 1920 × 462</option><option value="462,1920">D92 竖屏 · 462 × 1920</option><option value="1280,480">D69 横屏 · 1280 × 480</option><option value="480,1280">D69 竖屏 · 480 × 1280</option></select><button class="primary gap" onclick="createProject()">创建并编辑</button>`,true)}
function createProject(){let name=$('#projectname').value.trim();if(!name)return toast('请输入主题名称');let id=Math.max(...resources.map(r=>r.id))+1;resources.push({id,name,type:'主题',style:'paper',sizes:[$('#projectsize').value.split(',').map(Number)],local:true,created:true});closeModal();openEditor(id)}
function openEditor(id){editorBackup=structuredClone(getR(id));editorResource=id;editorLayout=0;let r=getR(id),data=r.layoutData?.[0]||{};editorText=data.text||r.text||'10:24';editorName=r.name;editorColor=data.color||r.color||(r.style==='paper'?'#4a463c':'#ffffff');if(data.style)r.style=data.style;editorDirty=false;go('editor')}
function editor(){let r=getR(editorResource),s=r.sizes[editorLayout],ratio=s[0]/s[1];return heading('主题编辑器','修改只作用于当前主题；设备输出需单独应用。',`<button onclick="go('creator')">返回项目</button><button onclick="saveEditor()">保存</button><button class="primary" onclick="saveEditor();startApply(${r.id},null)">完成并使用</button>`)+`<div class="panel row between" style="margin-bottom:16px;padding:12px 18px"><input aria-label="主题名称" value="${esc(editorName)}" maxlength="40" onchange="editorName=this.value;editorDirty=true"><select aria-label="分类" onchange="getR(editorResource).type=this.value;editorDirty=true;render()"><option ${r.type==='主题'?'selected':''}>主题</option><option ${r.type==='时钟'?'selected':''}>时钟</option></select><span id="saveLabel" class="muted small">${editorDirty?'未保存':'已保存'}</span><span class="grow"></span><label class="small muted">当前布局</label><select aria-label="当前布局" onchange="switchLayout(Number(this.value))">${r.sizes.map((s,i)=>`<option value="${i}" ${i===editorLayout?'selected':''}>${specName(s)} · ${sizeText(s)}</option>`).join('')}</select><button onclick="addLayout()">＋ 布局</button></div><div class="editor"><div class="panel"><h3>内容与图层</h3><div class="row gap"><button class="small" onclick="editorText='你好，世界';editorDirty=true;render()">＋ 文字</button><button class="small" onclick="editorText='10:24';editorDirty=true;render()">＋ 时钟</button></div><div class="divider"></div><span class="label">图层列表</span><div class="layer active">T　${editorText==='10:24'?'数字时钟':'文字图层'}</div><div class="layer">▧　背景</div><div class="notice gap">${layoutHint(r)}</div>${r.bgCopy?`<div class="notice gap">背景「${esc(r.bgCopy.name)}」已复制到主题，删除原素材不影响此主题。</div>`:''}</div><div class="stage"><div class="screen" style="width:${Math.min(650,380*ratio)}px;aspect-ratio:${ratio}"><div class="art ${r.style}"><b id="edittext" style="color:${editorColor}">${esc(editorText)}</b><small>FRIDAY · OCTOBER 30</small></div></div></div><div class="panel"><h3>元素属性</h3><label class="property"><span class="label gap">演示文字 / 时间</span><input value="${esc(editorText)}" maxlength="20" oninput="editorText=this.value;editorDirty=true;$('#edittext').textContent=this.value;$('#saveLabel').textContent='未保存'"></label><label class="property"><span class="label gap">颜色</span><input type="color" value="${editorColor}" oninput="editorColor=this.value;editorDirty=true;$('#edittext').style.color=this.value;$('#saveLabel').textContent='未保存'"></label><label class="property"><span class="label gap">背景风格</span><select onchange="getR(editorResource).style=this.value;editorDirty=true;render()">${['paper','ink','aurora','pink','mountain','sun'].map((v,i)=>`<option value="${v}" ${r.style===v?'selected':''}>${['暖纸','深蓝','极光','柔粉','山谷','日落'][i]}</option>`).join('')}</select></label><div class="divider"></div><span class="label">当前设计画布</span><strong>${sizeText(s)}</strong><p class="small muted gap">本原型演示属性修改与多布局流程；自由拖拽、复杂图层和真实时钟渲染由正式编辑器提供。</p></div></div>`}
function stashLayout(){let r=getR(editorResource);r.layoutData??={};r.layoutData[editorLayout]={text:editorText,color:editorColor,style:r.style};}
function switchLayout(i){stashLayout();editorLayout=i;let r=getR(editorResource),data=r.layoutData?.[i]||{};editorText=data.text||'10:24';editorColor=data.color||'#ffffff';if(data.style)r.style=data.style;render();}
function saveEditor(){stashLayout();let r=getR(editorResource);r.name=editorName.trim()||r.name;r.text=editorText;r.color=editorColor;r.created=true;editorBackup=structuredClone(r);editorDirty=false;render();toast('主题已保存在本次演示中')}
function addLayout(){modal(`<div class="modal-header"><h2>新增显示布局</h2><button onclick="closeModal()">关闭</button></div><label class="label">目标画布</label><select id="layoutsize" style="width:100%">${SPECS.map(s=>`<option value="${s}">${specName(s)} · ${sizeText(s)}</option>`).join('')}</select><p class="small muted gap">保留已有布局；新增布局需要重新检查文字与元素位置。</p><button class="primary gap" onclick="confirmLayout()">新增布局</button>`,true)}
function confirmLayout(){let s=$('#layoutsize').value.split(',').map(Number),r=getR(editorResource);if(r.sizes.some(x=>x[0]===s[0]&&x[1]===s[1]))return toast('该尺寸布局已存在');stashLayout();r.sizes.push(s);editorLayout=r.sizes.length-1;editorText='10:24';editorColor='#ffffff';editorDirty=true;closeModal();render()}
function playlistBase(){let p=playlists[selectedPlaylist];return heading('轮播列表','壁纸、视频和主题放在一起；每台设备独立播放。',`<button class="primary" onclick="newPlaylist()">＋ 新建列表</button>`)+`<div class="split"><div>${playlists.map((x,i)=>`<div class="list-item ${i===selectedPlaylist?'active':''}" onclick="selectedPlaylist=${i};render()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'){selectedPlaylist=${i};render()}"><strong>${esc(x.name)}</strong><div class="small muted">${x.items.length} 项 · ${x.playing?'轮播中':'未轮播'}</div></div>`).join('')}</div><div class="panel"><div class="row between"><h2>${esc(p.name)}</h2><button onclick="playlistPicker()">＋ 添加内容</button></div><div class="row gap"><label class="small muted">输出设备</label><select aria-label="轮播列表目标" onchange="playlists[selectedPlaylist].device=this.value;playlists[selectedPlaylist].playing=false;render()"><option value="">选择设备</option>${devices.map(d=>`<option value="${d.id}" ${p.device===d.id?'selected':''}>${esc(d.name)} · ${d.online?'已连接':'离线'}</option>`).join('')}</select><span class="grow"></span><button onclick="prevPlaylist()" ${!p.playing?'disabled':''}>上一项</button><button onclick="nextPlaylist()" ${!p.playing?'disabled':''}>下一项</button><button class="primary" onclick="togglePlaylist()">${p.playing?'暂停切换':'开始轮播'}</button></div><div class="notice gap">${p.playing?'当前：'+getR(p.items[p.at].id).name+' · 原型通过“下一项”演示切换':'暂停切换会保留当前画面。停止输出请到对应设备操作。'}</div><div style="overflow:auto" class="gap"><table class="table"><thead><tr><th>顺序 / 内容</th><th>适配</th><th>停留秒数</th><th>调整</th></tr></thead><tbody>${p.items.map((x,i)=>`<tr><td><div class="row" style="flex-wrap:nowrap;gap:12px"><span class="playlist-item-preview">${miniThumb(getR(x.id),getD(p.device)||refDev(),144,300)}</span><div><strong>${i+1}. ${esc(getR(x.id).name)}</strong><div class="small muted">${getR(x.id).type}</div></div></div></td><td>${badge(getR(x.id),getD(p.device))}</td><td><input aria-label="${getR(x.id).name}停留秒数" type="number" min="10" max="86400" value="${x.sec}" onchange="playlists[selectedPlaylist].items[${i}].sec=Math.max(10,Math.min(86400,Number(this.value)||30));render()"></td><td><button class="small" ${i===0?'disabled':''} onclick="movePlaylist(${i},-1)">↑</button> <button class="small" ${i===p.items.length-1?'disabled':''} onclick="movePlaylist(${i},1)">↓</button> <button class="small" onclick="removePlaylist(${i})">移除</button></td></tr>`).join('')}</tbody></table></div>${p.items.length?'':'<div class="empty">列表为空，请添加内容。</div>'}</div></div>`}

previewOnDevice=function(id){if(pv)endPreview(true);const d=activeDevice(),r=getR(id);if(!d?.online)return toast('当前设备离线，无法预览');if(!r.local||!r.sizes.length)return toast('请先下载并检查素材');const f=fit(r,d);if(f.loss>.05){modal(`<h2>预览会${fitWords(r,d)}</h2><p class="gap muted">设备方向不会改变。结束后恢复原内容。</p>${fitPreview(r,d,'contain')}<div class="row gap"><button onclick="closeModal()">取消</button><button class="primary" onclick="closeModal();beginPreview(${id},'${d.id}')">仍然预览</button></div>`,true);return}beginPreview(id,d.id)};
function beginPreview(id,devId){const d=getD(devId);if(!d?.online)return toast('设备已离线');if(pv)endPreview(true);const snap={id:d.id,content:d.content,running:d.running,fit:d.fit,lists:playlists.filter(p=>p.device===d.id).map(p=>({p,playing:p.playing,at:p.at}))};snap.lists.forEach(x=>x.p.playing=false);d.content=id;d.running=true;d.fit='contain';pv={snap,id,remaining:15,iv:setInterval(()=>{if(!pv)return;pv.remaining--;if(pv.remaining<=0)endPreview();else drawPreviewBar()},1000)};render()}
function drawPreviewBar(){document.getElementById('v5-preview')?.remove();if(!pv)return;const d=getD(pv.snap.id),el=document.createElement('div');el.id='v5-preview';el.className='v5-preview';el.setAttribute('role','status');el.innerHTML=`<span>${esc(d?.name||'设备')} · 临时预览 <b>${pv.remaining}</b> 秒</span><button onclick="endPreview()">结束并恢复</button><button class="primary" onclick="keepPreview()">保留并使用</button>`;document.body.appendChild(el)}
endPreview=function(silent){if(!pv)return;const session=pv;clearInterval(session.iv);pv=null;const d=getD(session.snap.id);if(d&&d.content===session.id){d.content=session.snap.content;d.running=d.online&&session.snap.running;d.fit=session.snap.fit;session.snap.lists.forEach(x=>{if(playlists.includes(x.p)){x.p.at=x.at;x.p.playing=d.online&&x.playing}})}render();if(!silent)toast(d?.online?'已恢复预览前内容与轮播状态':'已保留原内容记录，设备离线，未恢复输出')};
function keepPreview(){if(!pv)return;const {id,snap}=pv;endPreview(true);const d=getD(snap.id);if(d?.online)applyDirect(id,d.id);else toast('设备已离线，未应用')}
const stopV4=toggleOutput;
toggleOutput=function(id){if(pv?.snap.id===id)endPreview(true);stopV4(id)};
const orientationV4=requestOrientation;
requestOrientation=function(id,rot){if(pv?.snap.id===id)endPreview(true);orientationV4(id,rot)};
function fitWords(r,d){const f=fit(r,d);if(f.loss===null)return '尺寸未知';if(f.loss<=.01)return '完整适配';const s=r.sizes[f.index||0],ds=dims(d);return (s[0]/s[1]>ds[0]/ds[1]?'上下留边':'左右留边')+'（约 '+Math.round(f.loss*100)+'%）'}
badge=function(r,d){const f=fit(r,d);return `<span class="tag ${f.kind}">${d?fitWords(r,d):'选择设备查看适配'}</span>`};
const detailV4=resourceDetail;
resourceDetail=function(id){detailV4(id);if(devices.length>1){const box=$('#dialog .modal');box.insertAdjacentHTML('beforeend',`<div class="row gap"><span class="muted small">默认使用到 ${esc(activeDevice()?.name||'当前设备')}</span><button onclick="applyOther(${id})">选择其他设备 / 批量应用</button></div>`)}};
// Explicitly remove stale implementation claims from the planning view.
const guideV4=guide;
guide=function(){return '<div class="notice gap">V5 优先评审：当前设备、只浏览不旋转、直接应用、可恢复预览。以下旧规划仅作背景，硬件能力以实际客户端验证记录为准。</div>'+guideV4().replace('D69 的 VID/PID 和协议没有实机数据。','原型不验证 D69 协议；请参考现有项目的实机记录。')};
window.addEventListener('beforeunload',()=>{if(pv)clearInterval(pv.iv)});
target=devices[0]?.id||'';
render();
</script>
<style>
.v6-card-actions{display:flex;align-items:center;gap:6px;padding:9px;background:white}.v6-card-actions .primary{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.v6-card-actions button{font-size:12px;padding:6px 9px}.rcard.v .v6-card-actions{flex-wrap:wrap}.rcard.v .v6-card-actions .primary{flex-basis:100%}.v6-menu{display:grid;gap:9px}.v6-menu button{text-align:left}.v6-play{margin-top:16px;padding:15px;background:#eef3ff;border-radius:10px;display:grid;gap:8px}.v6-play progress{width:100%;accent-color:#4268ef}.v6-trash-row{padding:15px 0;border-bottom:1px solid #e5eaf2;display:flex;gap:12px;align-items:center}
</style>
<script>
// V6: simulated playback only. No media decoding, real output or persistence.
const recycleBin=[];
const clocks=new Map();
function duration(p){return Math.max(10,Math.min(86400,Number(p.items[p.at]?.sec)||30))*1000}
function eligible(p){const d=getD(p.device);return d?p.items.map((x,i)=>({x,i})).filter(({x})=>{const r=getR(x.id),f=fit(r,d);return r.local&&f.loss!==null&&f.loss<=.05}).map(x=>x.i):[]}
function syncClocks(now=performance.now()){for(const p of playlists){const d=getD(p.device),id=p.items[p.at]?.id,key=p.device+':'+id;let c=clocks.get(p);if(!c||c.key!==key){c={key,left:duration(p),last:now,active:false};clocks.set(p,c)}if(c.active)c.left=Math.max(0,c.left-(now-c.last));c.last=now;c.active=!!(p.playing&&d?.online&&d.running&&d.content===id);}}
function resetClock(p){clocks.delete(p)}
const renderV5=render;
render=function(){syncClocks();renderV5();document.querySelectorAll('.prototype').forEach(e=>e.textContent='交互原型 V6.3 · 大图轮播列表');const caption=document.querySelector('.sidebar .caption');if(caption)caption.innerHTML='我的 MiraBox 工作空间<br>多设备界面 · V6.3';if(page==='library')$('#main').insertAdjacentHTML('afterbegin',`<div class="row" style="justify-content:flex-end;margin-bottom:10px"><button onclick="openRecycleBin()">回收站 · ${recycleBin.length}</button></div>`);if(page==='playlists')drawPlaybackStatus()};
const cardV5=card;
// Resource cards retain V5 hover actions.
card=cardV5;
function resourceMenu(id){const r=getR(id);modal(`<div class="modal-header"><h2>${esc(r.name)}</h2><button onclick="closeModal()">关闭</button></div><div class="v6-menu"><button onclick="resourceDetail(${id})">查看详情</button>${r.local?`<button onclick="closeModal();pickPlaylist([${id}])">加入轮播列表</button><button onclick="closeModal();previewOnDevice(${id})">在当前设备临时预览</button><button onclick="applyOther(${id})">选择设备 / 批量应用</button>${r.type==='主题'||r.type==='时钟'?`<button onclick="closeModal();openEditor(${id})">编辑主题</button>`:`<button onclick="closeModal();useAsBackground(${id})">用作主题背景</button>`}<button class="danger" onclick="deleteResource(${id})">移入回收站</button>`:''}</div>`,true)}
function nextIndex(p,dir=1){const list=eligible(p);if(!list.length)return -1;if(p.shuffle){const options=list.filter(i=>i!==p.at);return options.length?options[Math.floor(Math.random()*options.length)]:list[0]}for(let n=1;n<=p.items.length;n++){const i=(p.at+dir*n+p.items.length*2)%p.items.length;if(list.includes(i))return i}return -1}
stepPlaylist=function(devId,dir,pl){const p=pl||playlists.find(x=>x.playing&&x.device===devId),d=getD(devId);if(!p||!d?.online)return;const i=nextIndex(p,dir);if(i<0){p.playing=false;render();return toast('没有适合此设备方向的本地内容，已暂停轮播')}p.at=i;d.content=p.items[i].id;d.running=true;d.fit='contain';resetClock(p);render()};
function startList(p){const d=getD(p.device);if(!d?.online)return toast('请先连接目标设备');const valid=eligible(p);if(!valid.length)return toast('没有适合此设备的本地内容');if(pv?.snap.id===d.id)endPreview(true);playlists.forEach(x=>{if(x!==p&&x.device===p.device)x.playing=false});if(!valid.includes(p.at)){p.at=valid[0];resetClock(p)}d.content=p.items[p.at].id;d.running=true;d.fit='contain';p.playing=true;render()}
togglePlaylist=function(){const p=playlists[selectedPlaylist];if(!p)return;if(p.playing){syncClocks();p.playing=false;render();toast('已暂停切换，保留当前内容')}else startList(p)};
playNow=function(i){selectedPlaylist=i;togglePlaylist()};
function drawPlaybackStatus(){const p=playlists[selectedPlaylist];if(!p)return;const panel=$('#main .split > .panel');if(!panel)return;const old=panel.querySelector('.notice.gap');if(old)old.remove();let el=document.getElementById('v6-play');if(!el){el=document.createElement('div');el.id='v6-play';el.className='v6-play';panel.insertBefore(el,panel.querySelector('div[style="overflow:auto"]'))}const d=getD(p.device),c=clocks.get(p),cur=p.items[p.at],ni=p.shuffle?-1:nextIndex(p),remaining=Math.ceil((c?.left??duration(p))/1000);el.innerHTML=`<div class="row between"><strong>${!d?.online?'设备离线':p.playing?'正在轮播':'已暂停切换'}</strong><span>${esc(d?.name||'未选设备')}</span></div><div>当前：${esc(getR(cur?.id).name)} · 剩余 <b id="v6-seconds">${remaining}</b> 秒</div><progress id="v6-progress" max="${duration(p)}" value="${duration(p)-(c?.left??duration(p))}"></progress><div class="small muted">下一项：${p.shuffle?'随机选择适合的内容':ni<0?'无可用内容':esc(getR(p.items[ni].id).name)} · 不适合的内容自动跳过</div><div class="small muted">此原型按停留时间自动切换示意画面；视频未解码，“播完再切换”尚未实现。</div>`}
function playbackTick(now=performance.now()){syncClocks(now);for(const p of playlists){const c=clocks.get(p);if(c?.active&&c.left<=0)stepPlaylist(p.device,1,p)}const p=playlists[selectedPlaylist],c=clocks.get(p);if(page==='playlists'&&c){const sec=document.getElementById('v6-seconds'),progress=document.getElementById('v6-progress');if(sec)sec.textContent=Math.ceil(c.left/1000);if(progress)progress.value=duration(p)-c.left}}
const playbackInterval=setInterval(playbackTick,250);
function reorderKeepCurrent(from,to){const p=playlists[selectedPlaylist],id=p.items[p.at]?.id;if(from<0||to<0||from>=p.items.length||to>=p.items.length)return;const [it]=p.items.splice(from,1);p.items.splice(to,0,it);p.at=Math.max(0,p.items.findIndex(x=>x.id===id));render()}
movePlaylist=function(i,n){reorderKeepCurrent(i,i+n)};
dropPl=function(j){reorderKeepCurrent(dragI,j);dragI=-1};
removePlaylist=function(i){const p=playlists[selectedPlaylist],id=p.items[p.at]?.id,removed=p.items.splice(i,1)[0];if(removed?.id===id){p.playing=false;resetClock(p)}p.at=Math.max(0,p.items.findIndex(x=>x.id===id));render()};
deleteResource=function(id){const r=getR(id),im=impacts(id);modal(`<div class="modal-header"><h2>移入回收站？</h2><button onclick="closeModal()">关闭</button></div><p>${esc(r.name)}</p><div class="notice warning gap">${im.devs.length} 台设备正在引用，相关输出将停止。${im.pls.length} 个轮播列表会移除此项。</div><p class="small muted gap">可在本次页面会话内恢复资源和列表位置。恢复不会自动启动设备；不删除电脑原文件。刷新页面会重置全部演示数据。</p><div class="row gap"><button onclick="closeModal()">取消</button><button class="primary" onclick="confirmDelete(${id})">移入回收站</button></div>`,true)};
confirmDelete=function(id){if(pv)endPreview(true);const r=resources.find(x=>x.id===id);if(!r)return;const entry={resource:structuredClone(r),fav:favs.includes(id),downloaded:downloaded.includes(id),refs:playlists.map(p=>({p,index:p.items.findIndex(x=>x.id===id),item:structuredClone(p.items.find(x=>x.id===id)||null)})).filter(x=>x.index>=0)};recycleBin.push(entry);devices.forEach(d=>{if(d.content===id){d.content=0;d.running=false;playlists.filter(p=>p.device===d.id).forEach(p=>p.playing=false)}});entry.refs.forEach(({p})=>{const current=p.items[p.at]?.id;p.items=p.items.filter(x=>x.id!==id);if(current===id)p.playing=false;p.at=Math.max(0,p.items.findIndex(x=>x.id===current));resetClock(p)});if(r.online||onlineIds.includes(id))r.local=false;else resources=resources.filter(x=>x.id!==id);favs=favs.filter(x=>x!==id);downloaded=downloaded.filter(x=>x!==id);closeModal();render();toast('已移入回收站，可从资源库恢复')};
function openRecycleBin(){modal(`<div class="modal-header"><h2>回收站 · ${recycleBin.length}</h2><button onclick="closeModal()">关闭</button></div><p class="small muted">仅本次演示会话有效。恢复不改变当前设备输出。</p>${recycleBin.map((e,i)=>`<div class="v6-trash-row"><div class="grow"><strong>${esc(e.resource.name)}</strong><div class="small muted">${e.resource.type} · ${e.refs.length} 个轮播列表引用</div></div><button class="primary" onclick="restoreResource(${i})">恢复</button></div>`).join('')||'<div class="empty">回收站为空</div>'}`)}
function restoreResource(i){const entry=recycleBin[i];if(!entry)return;const r=resources.find(x=>x.id===entry.resource.id);if(r)Object.assign(r,entry.resource);else resources.unshift(entry.resource);if(entry.fav&&!favs.includes(entry.resource.id))favs.push(entry.resource.id);if(entry.downloaded&&!downloaded.includes(entry.resource.id))downloaded.push(entry.resource.id);entry.refs.forEach(({p,index,item})=>{if(!playlists.includes(p)||p.items.some(x=>x.id===item.id))return;const cur=p.items[p.at]?.id;p.items.splice(Math.min(index,p.items.length),0,item);p.at=Math.max(0,p.items.findIndex(x=>x.id===cur))});recycleBin.splice(i,1);render();openRecycleBin();toast('已恢复资源与列表位置，未启动设备输出')}
window.addEventListener('beforeunload',()=>clearInterval(playbackInterval));
render();
</script>

<script>

  {type:'视频', names:'雾海慢行 极光信号 星港巡航 纸片飞舞 山谷云流 北境流光 轨道日落 萤火漫步 岭上云瀑 紫幕极光 深空脉冲 糖果粒子 云层呼吸 磁暴天幕 行星环游 蓝色波纹 云海潮汐 绿光之夜 星舰远航 彩纸回旋', categories:[['自然','云海'],['自然','极光'],['科幻',''],['动画','']]},
  {type:'主题', names:'晨间日历 今日清单 桌面仪表 夜间留白 月相日历 专注清单 性能哨站 琥珀时刻 周末日历 小小待办 网络观察 蓝色静夜 春日历页 今日三件事 带宽面板 深夜桌面 纸面日程 番茄清单 系统观察 暮色工作台', categories:[['效率','日历'],['效率','待办'],['监控','性能'],['氛围','']]}
];
const demoStyles = ['mountain','sun','night','mint','forest','ocean','aurora','pink','ice','ocean','night','mono','ice','ocean','plum','forest','mountain','dusk','ink','ember'];
