<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>静水 · Aquarium V1.1</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100b0e}body{cursor:auto}canvas{display:block;width:100%;height:100%;pointer-events:none}#startup-error{position:fixed;left:24px;top:24px;max-width:640px;color:#ffe5df;background:#291b22;padding:16px;font:16px/1.6 sans-serif}</style>
</head><body data-target="preview"><canvas aria-label="动态鱼缸"></canvas><p id="startup-error" role="alert" hidden></p>
<!-- aquarium-entry -->
<script>
if (location.protocol === 'file:') {
  location.replace(new URL('./preview.html', location.href).href);
} else {
  const entry = document.createElement('script');
  entry.type = 'module'; entry.src = './src/main.js';
  entry.onerror = () => {
    const message = document.getElementById('startup-error');
    message.textContent = '鱼缸程序加载失败。请重新构建后打开 preview.html。'; message.hidden = false;
  };
  document.body.appendChild(entry);
}
</script>
<!-- /aquarium-entry -->
</body></html>
