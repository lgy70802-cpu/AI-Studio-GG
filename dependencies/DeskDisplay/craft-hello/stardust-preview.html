<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>星尘数字时钟</title><style>body{background:#05071c;color:#deebff;font:16px sans-serif;margin:32px}canvas{max-width:100%;display:block}button,select{background:#25316a;color:white;padding:10px;border:1px solid #526ac1;margin:20px 10px 0 0}label{margin:15px}p{color:#8f9ebc}</style><h2>星尘数字时钟</h2><main></main><button id="demo">演示聚合</button><select id="size"><option value="1000,420">横向</option><option value="360,650">竖向</option></select><label><input id="motion" type="checkbox" checked>换字聚合</label><label><input id="breath" type="checkbox" checked>星光漂浮</label><p>固定字位 · 局部聚合 · 演示后恢复当前时间</p>
<script type="module">import {StardustRenderer,StardustState,timeDigits} from '/src/stardust.ts';const r=new StardustRenderer(),state=new StardustState();document.querySelector('main').append(r.canvas);document.querySelector('#demo').onclick=()=>state.demo(performance.now());let last='';function frame(now){state.update(timeDigits(),now);const s={animate:document.querySelector('#motion').checked},p=state.progress(now,s),phase=document.querySelector('#breath').checked?Math.floor(Date.now()/100):-1,size=document.querySelector('#size').value,key=state.revision+':'+p+':'+phase+':'+size;if(key!==last){const [w,h]=size.split(',').map(Number);r.draw(state.from,state.to,p,w,h,phase<0?0:phase*100);last=key}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
