<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原图颗粒时钟</title><style>body{background:#05071c;color:#deebff;font:16px sans-serif;margin:32px}canvas{max-width:100%;display:block}button,select{background:#25316a;color:white;padding:10px;border:1px solid #526ac1;margin:20px 10px 0 0}label{margin:15px}p{color:#8f9ebc}</style><h2>原图颗粒时钟</h2><main></main><button id="demo">演示切换</button><select id="size"><option value="1000,420">横向</option><option value="360,650">竖向</option></select><label><input id="motion" type="checkbox" checked>淡入淡出</label><label><input id="breath" type="checkbox" checked>冒号闪烁</label><p>1–9 来自参考图 · 0 为补绘 · 等比例固定字格</p>
<script type="module">import {ReferenceRenderer,ReferenceState,timeDigits,loadReference} from '/src/reference-clock.ts';await loadReference();const r=new ReferenceRenderer(),state=new ReferenceState();document.querySelector('main').append(r.canvas);document.querySelector('#demo').onclick=()=>state.demo(performance.now());let last='';function frame(now){state.update(timeDigits(),now);const s={animate:document.querySelector('#motion').checked},p=state.progress(now,s),phase=document.querySelector('#breath').checked?Math.floor(Date.now()%1000/500):-1,size=document.querySelector('#size').value,key=state.revision+':'+p+':'+phase+':'+size;if(key!==last){const [w,h]=size.split(',').map(Number);r.draw(state.from,state.to,p,w,h,phase<0?0:phase*500);last=key}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
