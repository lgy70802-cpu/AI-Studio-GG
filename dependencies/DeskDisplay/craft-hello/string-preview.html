<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>弦线数字时钟</title><style>body{background:#211e25;color:#eee;font:15px sans-serif;margin:36px}canvas{max-width:100%;display:block;border-radius:12px}label{display:inline-flex;gap:8px;margin:20px 14px 10px 0}select{padding:6px}p{color:#b4a5bc}</style><h2>弦线数字时钟</h2><canvas></canvas><label><input id="seconds" type="checkbox">显示秒</label><label><input id="threads" type="checkbox" checked>内部弦线</label><label><input id="shadow" type="checkbox" checked>柔和投影</label><label><input id="blink" type="checkbox" checked>冒号闪烁</label><label>背景<input id="bg" type="color" value="#9d85a5"></label><label>线条<input id="fg" type="color" value="#121014"></label><label>布局<select id="layout"><option value="1000,320">横向</option><option value="320,750">竖向</option></select></label><p>固定数字格、确定性弦线；时钟刷新时不会重新随机排列。</p><script type="module">
import {drawStringClock} from '/src/string-clock.ts';const $=id=>document.getElementById(id);function draw(){const [width,height]=$('layout').value.split(',').map(Number);drawStringClock(document.querySelector('canvas'),{ActionGeometry:{width,height},showSeconds:$('seconds').checked,threads:$('threads').checked,shadow:$('shadow').checked,blink:$('blink').checked,bgColor:$('bg').value,lineColor:$('fg').value})}document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',draw));draw();setInterval(draw,100);
</script></html>
