<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>白瓷指针时钟</title><style>body{background:#e8e8e8;color:#555;font:16px sans-serif;margin:28px}canvas{max-width:100%;display:block}label{display:inline-flex;gap:8px;margin:18px 12px 8px 0}select,input{padding:5px}p{color:#888}</style><h2>白瓷指针时钟</h2><canvas></canvas><label>标签<input id="label" value="本地时间"></label><label><input id="seconds" type="checkbox" checked>秒针</label><label><input id="digital" type="checkbox" checked>数字时间</label><label><input id="sweep" type="checkbox">平滑秒针</label><select id="size"><option value="600,600">方形</option><option value="1000,450">横向</option><option value="360,700">竖向</option></select><p>使用电脑本地时间；城市标签不会改变时区。</p><script type="module">import {drawPorcelain,porcelainKey,loadPorcelainDial} from '/src/porcelain.ts';await loadPorcelainDial();let last='';function draw(){const $=id=>document.getElementById(id);const [width,height]=$('size').value.split(',').map(Number);const s={label:$('label').value,seconds:$('seconds').checked,digital:$('digital').checked,sweep:$('sweep').checked,ActionGeometry:{width,height}},now=new Date(),key=JSON.stringify(s)+porcelainKey(s,now);if(key!==last){drawPorcelain(document.querySelector('canvas'),s,now);last=key}}document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',draw));draw();setInterval(draw,100);</script></html>
