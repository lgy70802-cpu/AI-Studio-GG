<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>木纹日历翻页时钟</title><style>body{margin:26px;background:#201812;color:#eee;font:16px sans-serif}canvas{width:100%;max-width:1920px}label,select{margin:14px 12px 0 0;padding:7px;background:#392b20;color:#eee}p{color:#b9a48e}</style><h2>木纹日历翻页时钟</h2><div id="view"></div><select id="wood"><option value="maple">浅色枫木</option><option value="walnut">深色胡桃木</option></select><label><input id="animate" type="checkbox" checked>翻页动画</label><p>D92 原生 1920×462 画布；五块翻牌分别显示月份、日期、小时、分钟和秒钟。</p><script type="module">import {CalendarFlipRenderer,CalendarFlipState,calendarValues,loadCalendarFlipFont} from '/src/calendar-flip.ts';await loadCalendarFlipFont();const r=new CalendarFlipRenderer(),state=new CalendarFlipState(),s={wood:'maple',labels:'en',animate:true,duration:440,ActionGeometry:{width:1920,height:462}};document.querySelector('#view').append(r.canvas);document.querySelector('#wood').onchange=e=>s.wood=e.target.value;document.querySelector('#animate').onchange=e=>s.animate=e.target.checked;let last='';function frame(now){state.update(calendarValues(),now);const p=state.progress(now,s),key=state.revision+':'+p+':'+s.wood;if(key!==last){r.draw(state.from,state.to,p,s);last=key}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
