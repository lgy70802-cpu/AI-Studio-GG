<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>黑白翻页时钟</title><style>body{background:#090b09;color:#eee;font:16px sans-serif;margin:40px}canvas{width:100%;max-width:1080px}button,select{padding:10px;margin:10px;background:#242824;color:#eee;border:1px solid #555}p{color:#aaa}</style><h2>黑白翻页时钟</h2><div id="view"></div><button id="demo">演示翻页</button><select id="speed"><option value="400">标准 · 400 毫秒</option><option value="800">慢速 · 800 毫秒</option><option value="250">快速 · 250 毫秒</option></select><label><input id="animate" type="checkbox" checked>翻页动画</label><p>演示结束后自动恢复当前时间。此页与 Craft 共用渲染器。</p>
<script type="module">import {MonoFlipRenderer,MonoFlipState,clockDigits,loadFlipFont,colonIsLit} from '/src/mono-flip.ts';await loadFlipFont();const r=new MonoFlipRenderer(),state=new MonoFlipState(),s={animate:true,duration:400};document.querySelector('#view').append(r.canvas);document.querySelector('#demo').onclick=()=>state.demo(performance.now(),s);document.querySelector('#speed').onchange=e=>s.duration=Number(e.target.value);document.querySelector('#animate').onchange=e=>s.animate=e.target.checked;let last='';function frame(now){state.update(clockDigits(),now,s);const lit=true;const p=state.progress(now,s),key=state.revision+':'+p+':'+lit;if(key!==last){r.draw(state.from,state.to,p,1500,560,lit);last=key}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
