<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>折纸带时钟</title><style>body{background:#1b1917;color:#eee;font:16px sans-serif;margin:36px}canvas{width:100%;max-width:1200px}button,select{padding:9px;margin:12px 8px 0 0;background:#3b2929;color:#fff;border:1px solid #805454}p{color:#aaa}</style><h2>折纸带时钟</h2><div id="view"></div><button id="demo">演示数字变形</button><select id="theme"><option value="red">中国红</option><option value="gold">黑金</option><option value="ice">冰蓝</option></select><p>此预览与 Craft 插件共用同一个 Canvas 渲染器。</p><script type="module">import {OrigamiState,drawOrigamiClock,origamiDigits} from '/src/origami-clock.ts';const canvas=document.createElement('canvas'),state=new OrigamiState(),s={theme:'red',animate:true,duration:650,blink:true,showDate:true,ActionGeometry:{width:1200,height:420}};document.querySelector('#view').append(canvas);document.querySelector('#demo').onclick=()=>state.demo(performance.now(),s);document.querySelector('#theme').onchange=e=>s.theme=e.target.value;let last='';function frame(now){const d=new Date();state.update(origamiDigits(d),now,s);const p=state.progress(now,s),key=state.revision+':'+p+':'+s.theme+':'+(d.getMilliseconds()<500);if(key!==last){drawOrigamiClock(canvas,state.from,state.to,p,s,d);last=key}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
