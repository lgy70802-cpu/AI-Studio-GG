<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>双联翻页时钟</title><style>body{background:#080808;color:#eee;font:16px sans-serif;margin:40px}canvas{width:100%;max-width:1420px;border:1px solid #202020}button,select{padding:9px;margin:12px 8px 0 0;background:#242424;color:#eee;border:1px solid #555}p{color:#999}</style><h2>双联翻页时钟</h2><div id="view"></div><button id="demo">演示翻页</button><select id="speed"><option value="450">标准 · 450 毫秒</option><option value="800">慢速 · 800 毫秒</option><option value="260">快速 · 260 毫秒</option></select><label><input id="date" type="checkbox" checked>显示英文日期</label><p>小时与分钟分别整块翻页，预览与 Craft 共用同一渲染器。</p><script type="module">import {DualFlipRenderer,DualFlipState,clockPairs,loadDualFlipFont} from '/src/dual-flip.ts';await loadDualFlipFont();const r=new DualFlipRenderer(),state=new DualFlipState(),s={animate:true,duration:450};document.querySelector('#view').append(r.canvas);document.querySelector('#demo').onclick=()=>state.demo(performance.now(),s);document.querySelector('#speed').onchange=e=>s.duration=Number(e.target.value);let showDate=true;document.querySelector('#date').onchange=e=>showDate=e.target.checked;let last='';function frame(now){state.update(clockPairs(),now,s);const p=state.progress(now,s),key=state.revision+':'+p+':'+showDate;if(key!==last){r.draw(state.from,state.to,p,1420,420,showDate);last=key}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
