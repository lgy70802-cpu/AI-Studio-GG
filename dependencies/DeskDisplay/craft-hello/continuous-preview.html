<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>连续纸带时钟</title><style>body{background:#1b1917;color:#eee;font:16px sans-serif;margin:36px}canvas{width:100%;max-width:1200px}button,select{padding:9px;margin:12px 8px 0 0;background:#3b2929;color:#fff;border:1px solid #805454}p{color:#aaa}</style><h2>连续纸带时钟</h2><div id="view"></div><button id="demo">演示展开与折回</button><select id="theme"><option value="red">中国红</option><option value="gold">黑金</option><option value="ice">冰蓝</option></select><p>稳定画面使用参考折纸字形；连续路径只在数字切换过程中出现。</p><script type="module">import {ContinuousRibbonState,continuousDigits,drawContinuousRibbon} from '/src/continuous-ribbon.ts';const canvas=document.createElement('canvas'),state=new ContinuousRibbonState(),s={theme:'red',animate:true,duration:1100,blink:true,showDate:true,breath:true,ActionGeometry:{width:1200,height:420}};document.querySelector('#view').append(canvas);document.querySelector('#demo').onclick=()=>state.demo(performance.now(),s);document.querySelector('#theme').onchange=e=>s.theme=e.target.value;let last='';function frame(now){const d=new Date();state.update(continuousDigits(d),now,s);const p=state.progress(now,s),key=state.revision+':'+p+':'+s.theme+':'+Math.round(d.getTime()/80);if(key!==last){drawContinuousRibbon(canvas,state.from,state.to,p,s,d);last=key}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
