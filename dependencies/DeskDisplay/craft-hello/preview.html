<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>你好，D92 · 开发预览</title><style>body{background:#080e13;color:#ccd7df;font:15px sans-serif;max-width:850px;margin:35px auto;padding:20px}canvas{max-width:100%;background:repeating-conic-gradient(#26313a 0% 25%,#1c252d 0% 50%) 0/20px 20px;border:1px solid #40505b}fieldset{border:1px solid #40505b;display:flex;gap:16px;flex-wrap:wrap;margin:18px 0}label{display:flex;gap:8px;align-items:center}button,select,input{accent-color:#72e4cc}p{color:#82939f}</style><h2>你好，D92 · 开发预览</h2><canvas></canvas><fieldset><label>文字<input id="text" value="你好，D92" maxlength="60"></label><label>尺寸<select id="size"><option value="600,240">横向</option><option value="240,600">竖向</option><option value="700,150">扁长</option></select></label></fieldset><fieldset><label>时间字体<select id="font"></select></label></fieldset><fieldset id="themes"></fieldset><fieldset id="toggles"></fieldset><fieldset><label>背景<input id="bg" type="color"></label><label>文字<input id="fg" type="color"></label><button id="reset">恢复默认</button></fieldset><p>棋盘格表示透明区域。预览与 Craft 使用同一个绘制函数。</p><script type="module">
import {drawClock} from '/src/render.ts';import {defaults,themes} from '/src/settings.ts';
import {timeFonts,ensureTimeFont} from '/src/fonts.ts';
let settings={...defaults};const canvas=document.querySelector('canvas');
let revision=0;const draw=async()=>{const rev=++revision;await ensureTimeFont(settings.timeFont);if(rev!==revision)return;const [width,height]=document.querySelector('#size').value.split(',').map(Number);drawClock(canvas,{...settings,ActionGeometry:{width,height}})};
const sync=()=>{document.querySelector('#font').value=settings.timeFont;document.querySelector('#text').value=settings.text;document.querySelector('#bg').value=settings.bgColor;document.querySelector('#fg').value=settings.textColor;document.querySelectorAll('[data-key]').forEach(e=>e.checked=settings[e.dataset.key]);draw()};
for(const [key,title] of Object.entries({showSeconds:'显示秒',showDate:'日期',showWeekday:'星期',hour12:'12 小时制',transparent:'透明背景'})){const label=document.createElement('label');label.textContent=title;const input=document.createElement('input');input.type='checkbox';input.dataset.key=key;input.onchange=()=>{settings[key]=input.checked;draw()};label.append(input);document.querySelector('#toggles').append(label)}
for(const [key,font] of Object.entries(timeFonts)){const o=new Option(font.label,key);document.querySelector('#font').add(o)}document.querySelector('#font').onchange=e=>{settings.timeFont=e.target.value;draw()};
for(const t of Object.values(themes)){const b=document.createElement('button');b.textContent=t.name;b.onclick=()=>{settings.bgColor=t.bgColor;settings.textColor=t.textColor;sync()};document.querySelector('#themes').append(b)}
for(const [id,key] of [['text','text'],['bg','bgColor'],['fg','textColor']])document.querySelector('#'+id).oninput=e=>{settings[key]=e.target.value;draw()};document.querySelector('#size').onchange=draw;document.querySelector('#reset').onclick=()=>{settings={...defaults};sync()};sync();setInterval(draw,1000);
</script></html>
