<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>科技仪表时钟</title><style>body{margin:34px;background:#111418;color:#eee;font:16px sans-serif}canvas{width:100%;max-width:1200px;border:1px solid #30343a}label,select{margin:14px 12px 0 0;padding:7px;background:#24282d;color:#eee}p{color:#9da4aa}</style><h2>科技仪表时钟</h2><div id="view"></div><label><input id="smooth" type="checkbox" checked>内圈光条平滑流动</label><select id="theme"><option value="orange">曜石橙</option><option value="ice">冰川蓝</option><option value="red">熔岩红</option></select><p>内圈光条的前端指向当前秒数，并随秒钟沿圆周运动。</p><script type="module">import {drawTechDial,loadTechDialFont} from '/src/tech-dial.ts';await loadTechDialFont();const canvas=document.createElement('canvas'),s={theme:'orange',smooth:true,showSeconds:true,showDate:true,railFlow:true,glow:85,ActionGeometry:{width:1200,height:400}};document.querySelector('#view').append(canvas);document.querySelector('#smooth').onchange=e=>s.smooth=e.target.checked;document.querySelector('#theme').onchange=e=>s.theme=e.target.value;function frame(){drawTechDial(canvas,s,new Date());requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
