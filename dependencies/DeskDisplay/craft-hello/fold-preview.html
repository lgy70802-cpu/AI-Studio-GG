<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>折光数字时钟</title><style>body{background:#211e25;color:#eee;font:15px sans-serif;margin:36px}canvas{max-width:100%;display:block;border-radius:12px}label{display:inline-flex;gap:8px;margin:20px 14px 10px 0}select{padding:6px}p{color:#b4a5bc}</style><h2>折光数字时钟</h2><canvas></canvas><label><input id="seconds" type="checkbox">显示秒</label><label><input id="blink" type="checkbox" checked>冒号闪烁</label><label>背景<input id="bg" type="color" value="#000000"></label><label>高光<input id="fg" type="color" value="#ffffff"></label><label>布局<select id="layout"><option value="1000,320">横向</option><option value="320,750">竖向</option></select></label><p>参考折带视觉重新设计；渐变弧面、固定字位，非原图字形的精确复制。</p><script type="module">
import {drawFoldClock,loadFoldFont} from '/src/fold-clock.ts';await loadFoldFont();const $=id=>document.getElementById(id);function draw(){const [width,height]=$('layout').value.split(',').map(Number);drawFoldClock(document.querySelector('canvas'),{ActionGeometry:{width,height},showSeconds:$('seconds').checked,blink:$('blink').checked,bgColor:$('bg').value,lineColor:$('fg').value})}document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',draw));draw();setInterval(draw,100);
</script></html>
