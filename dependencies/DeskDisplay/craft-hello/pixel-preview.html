<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>像素点阵时钟</title><style>body{background:#111416;color:#dce3e9;font:16px sans-serif;margin:32px}canvas{max-width:100%;display:block;border:1px solid #303437;border-radius:10px}label{display:inline-flex;gap:8px;margin:24px 12px 10px 0}p{color:#89969f}</style><h2>像素点阵时钟</h2><canvas></canvas><label><input id="seconds" type="checkbox" checked>显示秒</label><label><input id="blink" type="checkbox" checked>冒号闪烁</label><label><input id="glow" type="checkbox" checked>柔光</label><label>颜色<input id="color" type="color" value="#f4f8ff"></label><label>亮度<input id="brightness" type="range" min="10" max="100" value="90"></label><select id="size"><option value="1100,320">横向</option><option value="320,700">竖向</option></select><p>独立像素字形，无需字体文件；窄画布自动分行。</p><script type="module">import {drawPixelClock,pixelKey} from '/src/pixel-clock.ts';let last='';function draw(){const $=id=>document.getElementById(id),[width,height]=$('size').value.split(',').map(Number),s={ActionGeometry:{width,height},showSeconds:$('seconds').checked,blink:$('blink').checked,glow:$('glow').checked,color:$('color').value,brightness:Number($('brightness').value)},d=new Date(),key=JSON.stringify(s)+pixelKey(s,d);if(key!==last){drawPixelClock(document.querySelector('canvas'),s,d);last=key}}document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',draw));draw();setInterval(draw,100);</script></html>
