<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>高清木纹翻页时钟</title><style>body{margin:26px;background:#201812;color:#eee;font:16px sans-serif}canvas{width:100%;max-width:1920px}label,select{margin:14px 12px 0 0;padding:7px;background:#392b20;color:#eee}p{color:#b9a48e}</style><h2>高清木纹翻页时钟</h2><div id="view"></div><label><input id="animate" type="checkbox" checked>翻页动画</label><p>使用 BG.jpg 高清空白底图，只动态绘制数字和翻页过程。</p><script type="module">import {WoodPhotoRenderer,WoodPhotoState,loadWoodPhotoAssets,woodPhotoValues} from '/src/wood-photo-clock.ts';await loadWoodPhotoAssets();const r=new WoodPhotoRenderer(),state=new WoodPhotoState(),s={animate:true,duration:440,ActionGeometry:{width:1920,height:462}};document.querySelector('#view').append(r.canvas);document.querySelector('#animate').onchange=e=>s.animate=e.target.checked;let last='';function frame(now){state.update(woodPhotoValues(),now);const p=state.progress(now,s),key=state.revision+':'+p;if(key!==last){r.draw(state.from,state.to,p,s);last=key}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
