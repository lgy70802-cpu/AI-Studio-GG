      document.querySelector("#status").textContent = s.error || "\u5DF2\u5E94\u7528 \xB7 " + s.quotes.length + " \u6761\u884C\u60C5";
      render();
    }, tracker);
    feed.tick();
    render();
  }
  document.querySelector("#apply").onclick = () => {
    for (const key of ["rotateList", "rotateMarket", "rotateDetail"]) settings[key] = document.querySelector("#" + key).checked;
    for (const key of ["listSeconds", "marketSeconds", "detailSeconds"]) settings[key] = Number(document.querySelector("#" + key).value);
    settings.symbols = document.querySelector("#codes").value;
    settings.mode = document.querySelector("#mode").value;
    settings.focus = document.querySelector("#focus").value.trim().toLowerCase();
    settings.sort = document.querySelector("#sort").value;
    settings.fontScale = Number(document.querySelector("#font").value);
    settings.alertEnabled = document.querySelector("#alert").checked;
    settings.alertAbove = Number(document.querySelector("#above").value);
    settings.alertBelow = Number(document.querySelector("#below").value);
    start();
  };
  document.querySelector("#size").onclick = () => {
    settings.ActionGeometry = settings.ActionGeometry.width > settings.ActionGeometry.height ? { width: 640, height: 960 } : { width: 1920, height: 462 };
    render();
  };
  document.querySelector("#d92").onclick = () => {
    settings.ActionGeometry = { width: 1920, height: 462 };
    render();
  };
  loadManrope().then(render);
  start();
  var poll = setInterval(() => feed.tick(), 1e3);
  var flip = setInterval(() => {
    if (++elapsed >= screenSeconds(settings, page)) {
      elapsed = 0;
      page++;
    }
    render();
  }, 1e3);
  window.addEventListener("pagehide", () => {
    feed.stop();
    clearInterval(poll);
    clearInterval(flip);
  });
})();
</script></html>
