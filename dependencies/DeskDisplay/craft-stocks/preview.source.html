<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>A股插件预览</title><style>body{margin:24px;background:#080d14;color:#c4d0e0;font:14px 'Microsoft YaHei',sans-serif}canvas{width:100%;max-width:1920px;display:block;margin:20px 0}input,button{padding:9px;background:#182435;color:white;border:1px solid #40506a}input{width:380px}</style><h2>A 股自选行情 · 浏览器原型</h2><p>沪深股票可填六位代码，如 600519、300750；000001 默认指深市股票，上证指数请填 sh000001</p><input id="codes" value="sh600519,sz300750,sh600036,sh688981"><button id="apply">应用代码</button><button id="d92">D92 · 1920×462</button><button id="size">横 / 竖屏</button><p><label>模式 <select id="mode"><option value="list">自选列表</option><option value="market">大盘总览</option><option value="detail">个股详情</option><option value="rotate">三页轮播</option></select></label> <label>聚焦 <input id="focus" placeholder="600519 或 sh600519" style="width:130px"></label> <label>排序 <select id="sort"><option value="manual">输入顺序</option><option value="gain">涨幅优先</option><option value="loss">跌幅优先</option></select></label> <label>字号 <select id="font"><option value="1">标准</option><option value="1.15">较大</option><option value=".85">较小</option></select></label></p><p><label><input type="checkbox" id="alert" style="width:auto"> 价格提醒</label> <label>上穿 <input id="above" type="number" min="0" step=".01" style="width:100px"></label> <label>下穿 <input id="below" type="number" min="0" step=".01" style="width:100px"></label> 修改后点击“应用代码”。首次报价建立提醒基准。</p><p>轮播内容 <label><input id="rotateList" type="checkbox" checked style="width:auto">自选</label> <label><input id="rotateMarket" type="checkbox" checked style="width:auto">大盘</label> <label><input id="rotateDetail" type="checkbox" checked style="width:auto">详情</label> 停留秒数（5–120） <label>自选<input id="listSeconds" type="number" min="5" max="120" value="12" style="width:60px"></label> <label>大盘<input id="marketSeconds" type="number" min="5" max="120" value="12" style="width:60px"></label> <label>详情<input id="detailSeconds" type="number" min="5" max="120" value="12" style="width:60px"></label></p><p id="status" role="status">正在加载…</p><canvas></canvas><script type="module">
import {createFeed,draw,defaults,screenSeconds} from '/src/stocks.ts';
import {loadManrope} from './src/manrope.ts';
import {tabularTextWidth} from './src/canvas-text.ts';
import {AlertTracker} from './src/alerts.ts';
const tracker=new AlertTracker();
window.tabularTextWidth=tabularTextWidth;
const canvas=document.querySelector('canvas');let settings={...defaults,ActionGeometry:{width:1920,height:462}},scene={quotes:[],lines:{},lineTimes:{},error:'连接中'},feed,page=0,elapsed=0;
function render(){draw(canvas,scene,settings,page)}function start(){feed?.stop();page=0;elapsed=0;scene={quotes:[],lines:{},lineTimes:{},error:'正在连接行情…'};document.querySelector('#status').textContent='正在应用代码并获取行情…';feed=createFeed(settings,s=>{scene=s;window.stockScene=s;document.querySelector('#status').textContent=s.error||'已应用 · '+s.quotes.length+' 条行情';render()},tracker);feed.tick();render()}
document.querySelector('#apply').onclick=()=>{for(const key of ['rotateList','rotateMarket','rotateDetail'])settings[key]=document.querySelector('#'+key).checked;for(const key of ['listSeconds','marketSeconds','detailSeconds'])settings[key]=Number(document.querySelector('#'+key).value);settings.symbols=document.querySelector('#codes').value;settings.mode=document.querySelector('#mode').value;settings.focus=document.querySelector('#focus').value.trim().toLowerCase();settings.sort=document.querySelector('#sort').value;settings.fontScale=Number(document.querySelector('#font').value);settings.alertEnabled=document.querySelector('#alert').checked;settings.alertAbove=Number(document.querySelector('#above').value);settings.alertBelow=Number(document.querySelector('#below').value);start()};document.querySelector('#size').onclick=()=>{settings.ActionGeometry=settings.ActionGeometry.width>settings.ActionGeometry.height?{width:640,height:960}:{width:1920,height:462};render()};
document.querySelector('#d92').onclick=()=>{settings.ActionGeometry={width:1920,height:462};render()};
loadManrope().then(render);start();const poll=setInterval(()=>feed.tick(),1000),flip=setInterval(()=>{if(++elapsed>=screenSeconds(settings,page)){elapsed=0;page++}render()},1000);window.addEventListener('pagehide',()=>{feed.stop();clearInterval(poll);clearInterval(flip)});
</script></html>
